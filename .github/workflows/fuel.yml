name: Update fuel prices

on:
  schedule:
    - cron: "30 1 * * *" # 7:00 AM IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_fuel.py
      - name: Commit if prices changed
        run: |
          if git diff --quiet -- fuel.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel.json
          git commit -m "Fuel prices for $(date -u +%Y-%m-%d)"
          git push
